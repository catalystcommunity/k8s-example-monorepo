apiVersion: v1
kind: Service
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  type: {{ .Values.auth.service.type }}
  ports:
    - port: {{ .Values.auth.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.auth.prometheus.enabled }}
    - name: prometheus
      port: {{ .Values.auth.prometheus.port }}
      targetPort: prometheus
      protocol: TCP
    {{ end }}
  selector:
    {{- include "auth.selectorLabels" . | nindent 4 }}
